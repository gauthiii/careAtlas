name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # .env.production is committed and sets VITE_API_BASE_URL=https://careatlas.onrender.com/api
        # Vite picks it up automatically in production mode — no extra env needed here.

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          # Pin the CLI to the stable 13.x line. firebase-tools@latest (15.x) on the
          # GitHub runner throws gaxios "Premature close" while fetching the OAuth token,
          # which surfaces as a misleading "Failed to authenticate" error.
          firebaseToolsVersion: "13"
